<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Kuy</title>
 <script type="importmap"> {
 "imports": {
 "three": "https://esm.sh/three@0.160.0?dev",
 "three/": "https://esm.sh/three@0.160.0&dev/",
 "troika-three-text": "https://esm.sh/troika-three-text@0.49.0?external=three"
 }
 }

 <style>
body {
 margin: 0;
 padding: 0;
 background: #0a0025;
 font-family: 'Courier New', monospace;
 overflow: hidden;
}

 #ui-overlay {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
height: 100%;
pointer-events: none;
z-index: 100;
}

 .neon-text {
 position: absolute;
 font-size: 48px;
 font-weight: bold;
 color: #000000;
text-shadow: 
0 0 5px #ffffff,
 0 0 10px #ffffff,
 0 0 20px #ffffff,
0 0 40px rgb(255, 255, 255);
top: 50%;
 left: 50%;
transform: translate(-50%, -50%);
 animation: pulse 2s ease-in-out infinite alternate;
 letter-spacing: 3px;
 }

 .status-bar {
 position: absolute;
  top: 20px;
 left: 20px;
 color: #ff0000;
 font-size: 14px;
 text-shadow: 0 0 10px #ff0000;
 }

 .controls-info {
 position: absolute;
 bottom: 20px;
 left: 20px;
 color: #ff6600;
 font-size: 12px;
 text-shadow: 0 0 8px #ff6600;
 }

 @keyframes pulse {
 from { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
 to { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
 }

 .loading {
 position: absolute;
 top: 60%;
 left: 50%;
 transform: translateX(-50%);
 color: #ffffff;
 font-size: 16px;
 text-shadow: 0 0 15px #0a0a0a;
 animation: loading-blink 1s infinite;
 }

 @keyframes loading-blink {
 0%, 50% { opacity: 1; }
 51%, 100% { opacity: 0.3; }
 }
 </style>
</head>
<body>
 <div id="ui-overlay">
 <div class="neon-text">ไอ้บอสพ่อตาย</div>
 <div class="status-bar">
 </div>
 <div class="controls-info">
 kiding
 </div>
 <div class="loading" id="loading">Ayano oji...</div>
 </div>

</body>
</html>
